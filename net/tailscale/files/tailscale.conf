config settings 'settings'
	option log_stderr '1'
	option log_stdout '1'
	option port '41641'
	option state_file '/etc/tailscale/tailscaled.state'
	# default to using nftables - change below to 'iptables' if still using iptables
	option fw_mode 'nftables'
	# Optional Go runtime controls for devices with limited RAM:
	# gogc sets the garbage-collection target percentage.
	# gomemlimit sets a soft Go-managed memory limit, not an RSS limit.
	# Benchmark RAM and CPU before setting either option.
